<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><title id="t">GoDaddy renewal eligibility evidence</title><desc id="d">Official offer, customer and order scope, then actual response and matching amounts. Account testing not verified.</desc><rect width="1000" height="440" rx="20" fill="#101b2c"/><g font-family="Arial,sans-serif"><text x="40" y="55" fill="#a7c9dc" font-size="19">OFFICIAL REVIEW · 2026-10-24</text><text x="40" y="105" fill="white" font-size="33">A code string is not eligibility evidence.</text><rect x="40" y="145" width="280" height="145" rx="12" fill="#19384a"/><rect x="360" y="145" width="280" height="145" rx="12" fill="#263345"/><rect x="680" y="145" width="280" height="145" rx="12" fill="#19384a"/><g fill="white" font-size="23"><text x="60" y="190">1. Official offer</text><text x="60" y="240">Source + date</text><text x="380" y="190">2. Matching scope</text><text x="380" y="235">Customer + order</text><text x="380" y="269">Product + term</text><text x="700" y="190">3. Actual result</text><text x="700" y="235">Response + totals</text></g><text x="40" y="350" fill="#f3c98c" font-size="26">Real-account renewal and amounts: not verified</text><text x="40" y="398" fill="#a7c9dc" font-size="19">Proposed evidence checklist · No new cart or payment test</text></g></svg>