<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300"><rect width="960" height="300" rx="18" fill="#17232d"/><g font-family="Arial,sans-serif" fill="#fff"><text x="36" y="56" font-size="28">An add-on banner is only one part of the record.</text><text x="36" y="117" font-size="23" fill="#f3c778">Product + billing unit</text><text x="520" y="117" font-size="23" fill="#f3c778">Eligibility + detailed terms</text><text x="36" y="161" font-size="20">Match the named service and quantity.</text><text x="520" y="161" font-size="20">Do not assume unread conditions.</text><text x="36" y="236" font-size="21">Officially advertised is separate from accepted at checkout.</text><text x="36" y="276" font-size="18">Source review: 2026-11-27. No account or checkout test.</text></g></svg>