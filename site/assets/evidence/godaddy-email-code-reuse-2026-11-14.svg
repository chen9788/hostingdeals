<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">A code string is not an email entitlement</title><desc id="desc">Keep recipient, one-use history and actual order response separate. Account and checkout not verified.</desc><rect width="960" height="420" rx="20" fill="#1b1b1b"/><g font-family="Arial,sans-serif"><text x="38" y="62" font-size="29" font-weight="700" fill="#f6f6f6">A code string is not an email entitlement</text><text x="38" y="102" font-size="18" fill="#bcbcbc">Our evidence checklist for the GoDaddy Email Offer Agreement</text><g fill="#292929" stroke="#8c6831"><rect x="38" y="145" width="274" height="150" rx="12"/><rect x="343" y="145" width="274" height="150" rx="12"/><rect x="648" y="145" width="274" height="150" rx="12"/></g><g fill="#ffb64c" font-size="22" font-weight="700"><text x="59" y="185">1. Intended recipient</text><text x="365" y="185">2. One-use history</text><text x="671" y="185">3. Actual response</text></g><g fill="#eeeeee" font-size="17"><text x="59" y="224">Offer belongs to the account</text><text x="59" y="252">named in the email.</text><text x="365" y="224">A shared string does not</text><text x="365" y="252">show prior redemption.</text><text x="671" y="224">No cart acceptance or</text><text x="671" y="252">rejection observed here.</text></g><text x="38" y="344" font-size="20" font-weight="700" fill="#ffb64c">Account eligibility and checkout: not verified</text><text x="38" y="381" font-size="16" fill="#bcbcbc">Document review: 2026-11-14 · Historical attempts remain dated 2026-10-13</text></g></svg>
