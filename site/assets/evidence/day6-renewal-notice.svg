<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">A changed registration Total is not a verified renewal discount</title><desc id="desc">HADOMAINS registration test on October 13, 2026. Total changes from $40.59 to $36.59. The $19.99 per year renewal notice stays the same. Actual renewal application remains not verified.</desc><rect width="720" height="440" fill="#252525"/><g font-family="Arial,Helvetica,sans-serif" fill="#f4f4f4"><text x="30" y="49" font-size="27" font-weight="700">Read the field, not just the discount</text><path d="M30 72H690M30 190H690M30 308H690" stroke="#6b6b6b"/><text x="30" y="112" font-size="24" fill="#f5ad50">REGISTRATION TOTAL · HADOMAINS</text><text x="30" y="162" font-size="36" font-weight="700">$40.59 → $36.59</text><text x="30" y="230" font-size="24" fill="#f5ad50">FUTURE RENEWAL NOTICE</text><text x="30" y="281" font-size="32">$19.99/year → $19.99/year</text><text x="30" y="350" font-size="26" font-weight="700">Actual renewal coupon: not verified</text><text x="30" y="395" font-size="24">Cart: 2026-10-13 · Review: 2026-10-18</text></g></svg>
