name: Refresh brand coupons in headed Chrome
on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_dynamic.py', 'dynamic_deals.py', 'config/dynamic-deals.json']
permissions:
  contents: write
concurrency:
  group: official-offer-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chrome automation library
        run: pip install playwright==1.55.0
      - name: Confirm branded Google Chrome
        run: google-chrome --version
      - name: Test freshness, source and expiry rules
        run: python -m unittest discover -s tests -v
      - name: Collect official coupons in graphical Chrome
        run: xvfb-run --auto-servernum python collect_dynamic.py
      - name: Build and validate
        run: |
          python build.py
          python validate.py
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headed-chrome-official-evidence
          path: work/dynamic-evidence/
          retention-days: 30
      - name: Publish refreshed evidence and site
        run: |
          git config user.name 'hostingdeals-update[bot]'
          git config user.email 'hostingdeals-update[bot]@users.noreply.github.com'
          git add data/dynamic-deals.json site
          if ! git diff --cached --quiet; then
            git commit -m "Refresh brand-layer coupons from headed Google Chrome"
            git push origin HEAD:main
          fi
