<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">A sale is not proof of an extra coupon saving</title><desc id="desc">Record the advertised sale, the email offer terms and the actual order response separately. No stacking or checkout tested.</desc><rect width="960" height="420" rx="20" fill="#1b1b1b"/><g font-family="Arial,sans-serif"><text x="36" y="62" font-size="28" font-weight="700" fill="#f6f6f6">A sale is not proof of an extra coupon saving</text><text x="36" y="104" font-size="18" fill="#bcbcbc">Our evidence checklist for special offers under the Email Offer Agreement</text><g fill="#292929" stroke="#8c6831"><rect x="36" y="146" width="276" height="150" rx="12"/><rect x="342" y="146" width="276" height="150" rx="12"/><rect x="648" y="146" width="276" height="150" rx="12"/></g><g fill="#ffb64c" font-size="22" font-weight="700"><text x="56" y="188">1. Advertised sale</text><text x="363" y="188">2. Email offer</text><text x="670" y="188">3. Order response</text></g><g fill="#eeeeee" font-size="17"><text x="56" y="229">Match the product, term</text><text x="56" y="257">and amount label.</text><text x="363" y="229">Read its restriction on</text><text x="363" y="257">combining promotions.</text><text x="670" y="229">No extra discount or</text><text x="670" y="257">rejection measured here.</text></g><text x="36" y="346" font-size="21" font-weight="700" fill="#ffb64c">Stacking and checkout: not verified</text><text x="36" y="383" font-size="16" fill="#bcbcbc">Document review: 2026-11-16 · Historical attempts remain dated 2026-10-13</text></g></svg>
