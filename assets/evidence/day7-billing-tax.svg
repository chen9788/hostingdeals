<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Billing tax: three evidence scopes</title><desc id="desc">Official field definition, historical registration cart, and unverified actual renewal are separate.</desc><rect width="720" height="420" rx="16" fill="#111923"/><g font-family="Arial,sans-serif" fill="#f3f6fa"><text x="32" y="48" font-size="25" font-weight="700">Billing tax: keep the evidence separate</text><path d="M32 68H688M32 166H688M32 278H688" stroke="#39495c"/><text x="32" y="100" font-size="18" fill="#ffb36b">OFFICIAL GUIDE · reviewed 2026-10-19</text><text x="32" y="132" font-size="21">Renewal-price field = before-tax base price</text><text x="32" y="198" font-size="18" fill="#ffb36b">REGISTRATION CART · tested 2026-10-13</text><text x="32" y="230" font-size="21">HADOMAINS: Total $40.59 → $36.59</text><text x="32" y="258" font-size="18">.com / 3 years · both texts show Taxes $0</text><text x="32" y="310" font-size="18" fill="#ffb36b">ACTUAL RENEWAL · not verified</text><text x="32" y="344" font-size="21">Tax breakdown, final Total and paid amount</text><text x="32" y="385" font-size="16" fill="#c7d3df">Original evidence map — not a checkout or account screenshot</text></g></svg>