<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><rect width="960" height="420" rx="24" fill="#101b2e"/><g font-family="Arial,sans-serif" fill="#edf3ff"><text x="40" y="58" font-size="29" font-weight="bold">Monthly → yearly does not unlock a free domain</text><text x="40" y="96" font-size="19" fill="#a9bbd5">Official documentation checked 2026-10-23 · Account claim: not verified</text><rect x="35" y="125" width="890" height="74" rx="12" fill="#203653"/><text x="55" y="157" font-size="23">Existing hosting: billing-cycle change</text><text x="55" y="184" font-size="18">Excluded by the official free-domain eligibility rules.</text><rect x="35" y="213" width="890" height="78" rx="12" fill="#203653"/><text x="55" y="246" font-size="23">New eligible plan: 12 months or longer</text><text x="55" y="275" font-size="18">Separate first-year benefit; plan, extension and claim conditions apply.</text><rect x="35" y="305" width="890" height="78" rx="12" fill="#163d46"/><text x="55" y="339" font-size="22">HADOMAINS cart: $40.59 → $36.59 · 2026-10-13</text><text x="55" y="367" font-size="18">Paid standalone registration evidence, not a free-domain claim.</text></g></svg>