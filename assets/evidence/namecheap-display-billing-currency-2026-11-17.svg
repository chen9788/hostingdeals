<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Display currency and processing currency are separate evidence</title><desc id="desc">Keep the estimated display, the merchant's published processing rule and the actual payment record separate. No conversion or payment tested.</desc><rect width="960" height="420" rx="20" fill="#1b1b1b"/><g font-family="Arial,sans-serif"><text x="36" y="62" font-size="28" font-weight="700" fill="#f6f6f6">Display currency is not a payment receipt</text><text x="36" y="103" font-size="18" fill="#bcbcbc">Our evidence checklist for Namecheap's published processing-currency rule</text><g fill="#292929" stroke="#8c6831"><rect x="36" y="145" width="276" height="150" rx="12"/><rect x="342" y="145" width="276" height="150" rx="12"/><rect x="648" y="145" width="276" height="150" rx="12"/></g><g fill="#ffb64c" font-size="22" font-weight="700"><text x="56" y="187">1. Display estimate</text><text x="363" y="187">2. Processing rule</text><text x="669" y="187">3. Payment record</text></g><g fill="#eeeeee" font-size="17"><text x="56" y="229">Keep the currency, term</text><text x="56" y="257">and observation date.</text><text x="363" y="229">Published terms specify</text><text x="363" y="257">processing in US dollars.</text><text x="669" y="229">No receipt or converted</text><text x="669" y="257">payment observed here.</text></g><text x="36" y="345" font-size="21" font-weight="700" fill="#ffb64c">Conversion outcome and checkout: not verified</text><text x="36" y="383" font-size="16" fill="#bcbcbc">Document review: 2026-11-17 · Historical cart evidence remains dated 2026-10-13</text></g></svg>
